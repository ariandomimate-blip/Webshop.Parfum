<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATG Admin – Produktnamen</title>
<style>
body{margin:0;background:#070b0d;color:#f5eee2;font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}
h1{font-family:Georgia,serif;color:#e8c878}.card{background:#10181d;border:1px solid #d7b36b55;border-radius:16px;padding:20px;margin:14px 0}
input,button{box-sizing:border-box;border-radius:9px;padding:12px;border:1px solid #d7b36b55}input{background:#05090b;color:#fff;width:100%}button{background:#d7b36b;color:#111;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:70px 1fr 110px;gap:10px;align-items:center;margin:10px 0}.id{color:#d7b36b;font-weight:700}.status{margin:10px 0;color:#d7b36b}.top{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.row{grid-template-columns:45px 1fr}.row button{grid-column:2}.top{grid-template-columns:1fr}}.hidden{display:none!important}
</style></head><body><div class="wrap">
<h1>♛ ATG Parfums – Administrator</h1>
<div id="login" class="card"><h2>Admin-Anmeldung</h2><input id="token" type="password" placeholder="ADMIN_API_TOKEN"><button id="loginBtn">ANMELDEN</button><div id="loginStatus" class="status"></div></div>
<div id="panel" class="hidden"><div class="top"><input id="search" placeholder="Produkt oder ID suchen …"><button id="logout">ABMELDEN</button></div><div id="status" class="status"></div><div id="products"></div></div>
</div><script>
const tokenKey='atg_admin_token';let token=localStorage.getItem(tokenKey)||'',products=[];const $=id=>document.getElementById(id);
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function load(){const r=await fetch('/api/admin/products',{headers:headers()});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Anmeldung fehlgeschlagen');products=(await r.json()).products||[];$('login').classList.add('hidden');$('panel').classList.remove('hidden');render()}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const q=$('search').value.toLowerCase();$('products').innerHTML=products.filter(p=>String(p.id).includes(q)||p.name.toLowerCase().includes(q)).map(p=>'<div class="card row"><div class="id">#'+p.id+'</div><input id="name-'+p.id+'" value="'+esc(p.name)+'"><button data-save="'+p.id+'">SPEICHERN</button></div>').join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save))}
async function save(id){const name=$('name-'+id).value.trim();if(!name)return;$('status').textContent='Speichere Produkt #'+id+' …';const r=await fetch('/api/admin/products/'+id,{method:'PATCH',headers:headers(),body:JSON.stringify({name})});const d=await r.json().catch(()=>({}));if(!r.ok){$('status').textContent='❌ '+(d.error||'Fehler');return}products.find(p=>String(p.id)===String(id)).name=name;$('status').textContent='✅ Produkt #'+id+' gespeichert. GitHub-Commit erstellt.';render()}
$('loginBtn').onclick=async()=>{token=$('token').value.trim();try{await load();localStorage.setItem(tokenKey,token)}catch(e){$('loginStatus').textContent='❌ '+e.message}};
$('logout').onclick=()=>{localStorage.removeItem(tokenKey);location.reload()};$('search').oninput=render;if(token)load().catch(()=>{localStorage.removeItem(tokenKey);token=''})
</script></body></html>
